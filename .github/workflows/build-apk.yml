name: Build and Release PowerWidget APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/PowerWidget.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerWidget-APK
          path: release-output/PowerWidget.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "PowerWidget v1.0.0"
          body: |
            🎉 Первая версия виджета отключений света для Android!
            
            ### Возможности:
            - 🟢/🔴 Крупный статус света прямо на рабочем столе телефона
            - 📡 Поддержка реального датчика СвітлоБота (ул. Грушевского, 70 для очереди 2.1)
            - ⏳ Обратный отсчёт до следующего отключения или включения
            - 🔄 Кнопка мгновенного ручного обновления
            - 🚀 Встроенный автоапдейтер через GitHub Releases
          files: release-output/PowerWidget.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
